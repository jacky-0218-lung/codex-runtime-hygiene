name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Repository guard
        shell: powershell
        run: ./tools/check-repository.ps1
      - name: Runtime hygiene tests
        shell: powershell
        run: ./tests/test-runtime-hygiene.ps1
